services:
  - type: web
    name: discord-bot
    runtime: node
    rootDir: artifacts/discord-bot
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: NODE_ENV
        value: production
